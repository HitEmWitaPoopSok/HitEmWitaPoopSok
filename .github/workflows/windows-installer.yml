# Builds JARVIS-Setup-<version>.exe on a Windows runner.
#
# Run it by hand (Actions -> windows-installer -> Run workflow), or push a tag
# like v1.0.0 to also publish the installer as a GitHub Release.

name: windows-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (x.y.z)"
        default: "1.0.0"
  push:
    tags: ["v*"]
    branches: ["main", "claude/windows-port-*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          elseif ("${{ inputs.version }}") { $v = "${{ inputs.version }}" }
          else { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./windows/build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Smoke-test the install
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\out\JARVIS-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$PWD\smoke","/fishkey=test_key_123","/username=Tester" -Wait
          $envFile = Join-Path $env:APPDATA "JARVIS\.env"
          if (-not (Test-Path $envFile)) { throw "installer did not write $envFile" }
          $envText = Get-Content $envFile -Raw
          if ($envText -notmatch "(?m)^FISH_API_KEY=test_key_123\s*$") { throw "FISH_API_KEY not saved:`n$envText" }
          if ($envText -notmatch "(?m)^USER_NAME=Tester\s*$") { throw "USER_NAME not saved:`n$envText" }
          Write-Host "installer saved the Fish key and name"
          & "$PWD\smoke\python\python.exe" -c "import fastapi, uvicorn, httpx, websockets, pydantic, playwright; print('imports ok')"
          # The server itself: start it the way the launcher does and ask it a question.
          $env:PYTHONUTF8 = "1"
          $env:JARVIS_DATA_DIR = "$PWD\smoke-data"
          $env:JARVIS_ENV_FILE = $envFile
          $env:JARVIS_BRAIN_AUTOSTART = "0"
          $p = Start-Process "$PWD\smoke\python\python.exe" -ArgumentList "$PWD\smoke\app\server.py","--port","8341" `
               -WorkingDirectory "$PWD\smoke\app" -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest "http://127.0.0.1:8341/" -UseBasicParsing; $ok = ($r.StatusCode -eq 200) } catch {}
          }
          $fishSaved = $false
          if ($ok) {
            try { $fishSaved = (Invoke-RestMethod "http://127.0.0.1:8341/api/settings/status" -UseBasicParsing).env_keys_set.fish_audio } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($ok -and -not $fishSaved) { throw "the server does not see the Fish key the installer saved" }
          if (-not $ok) { Get-Content smoke-out.txt, smoke-err.txt; throw "installed server never answered" }
          Write-Host "installed server answered 200"

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup
          path: build/out/JARVIS-Setup-*.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: JARVIS for Windows ${{ steps.ver.outputs.version }}
          files: build/out/JARVIS-Setup-*.exe
