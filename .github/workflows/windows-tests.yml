name: windows-tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      JARVIS_BRAIN_AUTOSTART: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Test suite
        run: |
          pytest -q --tb=short -rfE -o faulthandler_timeout=300 -p no:cacheprovider 2>&1 | Tee-Object -FilePath pytest.log
          exit $LASTEXITCODE
      - name: Failure summary
        if: always()
        shell: pwsh
        run: |
          Select-String -Path pytest.log -Pattern '^(FAILED|ERROR) ' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(170, $_.Line.Length)) }
          Select-String -Path pytest.log -Pattern ' passed| failed' | Select-Object -Last 1 | ForEach-Object { $_.Line }
